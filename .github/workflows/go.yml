name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external modules yet.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd/xenri internal/cli)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files not formatted with gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/xenri" ./cmd/xenri
      - name: Smoke test CLI
        run: |
          test "$("$RUNNER_TEMP/xenri" version)" = 'xenri dev'
          "$RUNNER_TEMP/xenri" --help | grep -Fq 'MCP proxy operations are not implemented.'
  nix:
    name: Nix dev shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Validate development shell
        run: |
          nix flake lock
          echo 'LOCKFILE_BEGIN'
          cat flake.lock
          echo 'LOCKFILE_END'
          nix develop --command bash -euo pipefail -c '
            command -v go
            command -v gofmt
            command -v git
            go version
            go vet ./...
            go test -race ./...
          '
