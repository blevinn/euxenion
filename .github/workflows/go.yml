name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external modules yet.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd/xenri internal/cli)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files not formatted with gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/xenri" ./cmd/xenri
      - name: Smoke test CLI
        run: |
          test "$("$RUNNER_TEMP/xenri" version)" = 'xenri dev'
          "$RUNNER_TEMP/xenri" --help | grep -Fq 'MCP proxy operations are not implemented.'
