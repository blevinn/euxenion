# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: xenri

builds:
  - id: xenri
    main: ./cmd/xenri
    binary: xenri
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/blevinn/euxenion/internal/cli.Version=v{{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "xenri_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: "true"
  make_latest: false
  replace_existing_artifacts: false
  preflight:
    fail_on_error: true
